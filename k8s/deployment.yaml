apiVersion: v1
kind: Namespace
metadata:
  name: studium
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studium-users-config
  namespace: studium
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  AWS__Region: "us-east-2"
  RabbitMQ__ConnectionString: "amqp://studium:StudiumRabbitMQ2026!@studium-rabbitmq-service.studium.svc.cluster.local:5672"
  RabbitMQ__UsersQueueName: "studium-users-events-queue"
  RabbitMQ__BookingQueueName: "studium-booking-events-queue"
  RabbitMQ__AuditQueueName: "studium-audit-events-queue"
  Users__MaxNoShowsBeforeSuspension: "3"
  Users__SuspensionDays: "7"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studium-users
  namespace: studium
  labels:
    app: studium-users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studium-users
  template:
    metadata:
      labels:
        app: studium-users
    spec:
      containers:
        - name: studium-users
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: studium-users-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: studium-users-secrets
                  key: DefaultConnection
            - name: AWS__Cognito__Authority
              valueFrom:
                secretKeyRef:
                  name: studium-users-secrets
                  key: CognitoAuthority
            - name: AWS__Cognito__ClientId
              valueFrom:
                secretKeyRef:
                  name: studium-users-secrets
                  key: CognitoClientId
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: studium-users-secrets
                  key: AwsAccessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: studium-users-secrets
                  key: AwsSecretAccessKey
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: studium-users-service
  namespace: studium
  labels:
    app: studium-users
spec:
  type: ClusterIP
  selector:
    app: studium-users
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: studium-users-hpa
  namespace: studium
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: studium-users
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studium-rabbitmq
  namespace: studium
  labels:
    app: studium-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studium-rabbitmq
  template:
    metadata:
      labels:
        app: studium-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "studium"
            - name: RABBITMQ_DEFAULT_PASS
              value: "StudiumRabbitMQ2026!"
            - name: RABBITMQ_DEFAULT_VHOST
              value: "/"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: studium-rabbitmq-service
  namespace: studium
  labels:
    app: studium-rabbitmq
spec:
  type: ClusterIP
  selector:
    app: studium-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
